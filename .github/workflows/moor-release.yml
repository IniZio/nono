name: Moor release

on:
  push:
    tags:
      - "v*-moor.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned so the binary is always built from the vetted source revision.
  SOURCE_REV: 7c7012b0ba25310644072a2133d9cab699e7a9e4
  NONO_VERSION: v0.80.0

jobs:
  build:
    if: github.repository == 'IniZio/nono'
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-apple-darwin
            os: macos-14

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REV }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross

      - name: Build
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }} -p nono-cli
        env:
          NONO_INSTALL_SOURCE: github_release

      - name: Build (cross aarch64-unknown-linux-gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target aarch64-unknown-linux-gnu -p nono-cli
        env:
          NONO_INSTALL_SOURCE: github_release

      # The tarballs carry no dependency metadata, so a libdbus link would
      # break startup on hosts without it.
      - name: Verify binary does not link libdbus (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/nono"
          needed="$(objdump -p "$bin" | awk '/NEEDED/ {print $2}')"
          echo "$needed"
          if echo "$needed" | grep -qi '^libdbus'; then
            echo "::error::$bin links libdbus"
            exit 1
          fi

      # The macOS binary keeps the linker's ad-hoc signature; do not strip it.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cd "target/${{ matrix.target }}/release"
          tar czf "$GITHUB_WORKSPACE/nono-${NONO_VERSION}-${{ matrix.target }}.tar.gz" nono

      - uses: actions/upload-artifact@v4
        with:
          name: nono-${{ matrix.target }}
          path: nono-*.tar.gz
          if-no-files-found: error

  release:
    if: github.repository == 'IniZio/nono'
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nono-*
          merge-multiple: true

      - name: Checksums
        run: sha256sum nono-*.tar.gz | tee SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" nono-*.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "nono v0.80.0 (moor fork)" \
            --notes "nono ${NONO_VERSION} built from ${SOURCE_REV} (upstream ${NONO_VERSION} plus passthrough phantom-header strip and upstream extra CA)." \
            --latest=false
